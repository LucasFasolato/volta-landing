name: Corporate isolated verification workspace
on:
  push:
    branches: [feat/corporate-hub-20260906]
permissions:
  contents: read
concurrency:
  group: corporate-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce the reviewed security patch
        run: |
          mkdir -p /tmp/corporate-evidence
          npm install --save-exact next@16.3.3 eslint-config-next@16.3.3
          npm audit --omit=dev --json > /tmp/corporate-evidence/audit-production.json
          cp package.json package-lock.json /tmp/corporate-evidence/
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix /tmp/volta-browser --no-package-lock --no-audit --no-fund playwright@1.57.0 @axe-core/playwright@4.11.0
          /tmp/volta-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify production build in the browser
        run: |
          npm start > /tmp/corporate-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000 >/dev/null && break; sleep 1; done
          node scripts/verify-browser.mjs
      - name: Package evidence
        if: always()
        run: |
          mkdir -p /tmp/corporate-evidence
          cp /tmp/corporate-server.log /tmp/corporate-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-hub-evidence
          path: /tmp/corporate-evidence
          retention-days: 3
          compression-level: 0
  persist-reviewed-lock:
    needs: workspace
    if: github.repository == 'LucasFasolato/volta-landing' && github.ref == 'refs/heads/feat/corporate-hub-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: corporate-hub-evidence
          path: evidence
      - name: Commit only the exact reviewed dependency files to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const repo = 'LucasFasolato/volta-landing';
          const branch = 'feat/corporate-hub-20260906';
          const expected = process.env.EXPECTED_HEAD;
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(process.env.GITHUB_REF, `refs/heads/${branch}`);
          assert.match(expected, /^[0-9a-f]{40}$/);
          const approved = {
            'package.json': 'e92c3ba77f76a697d0f3436cdf2e457fe2e61d1b2f17abe7921238f3370a57b3',
            'package-lock.json': '297be34d15d19f7c3e0ff33e4975c947ce63d3b6b74812d6a293107d0d1a5e00'
          };
          const files = Object.entries(approved).map(([path, hash]) => {
            const content = readFileSync(`evidence/${path}`, 'utf8');
            assert.equal(createHash('sha256').update(content).digest('hex'), hash, `Unreviewed ${path}`);
            return { path, content };
          });
          const report = JSON.parse(readFileSync('evidence/audit-production.json', 'utf8'));
          assert.equal(report.metadata.vulnerabilities.total, 0);
          async function api(path, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(15000),
              redirect: 'error'
            });
            if (!response.ok) throw new Error(`${method} ${path}: ${response.status}`);
            return response.json();
          }
          const ref = await api(`git/ref/heads/${branch}`);
          assert.equal(ref.object.sha, expected, 'Concurrent branch change: stop without overwriting');
          const parent = await api(`git/commits/${expected}`);
          const tree = [];
          for (const file of files) {
            const blob = await api('git/blobs', 'POST', { content: file.content, encoding: 'utf-8' });
            tree.push({ path: file.path, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const nextTree = await api('git/trees', 'POST', { base_tree: parent.tree.sha, tree });
          const commit = await api('git/commits', 'POST', {
            message: 'fix: apply verified Next.js 16.3.3 security patch',
            tree: nextTree.sha,
            parents: [expected],
            author: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' }
          });
          await api(`git/refs/heads/${branch}`, 'PATCH', { sha: commit.sha, force: false });
          console.log(`Verified dependency commit: ${commit.sha}`);
          NODE
