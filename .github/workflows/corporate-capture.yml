name: Corporate product imagery capture
on:
  push:
    branches: [feat/corporate-v1-final]
    paths: [.github/workflows/corporate-capture.yml, scripts/capture-public.mjs]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/corporate-v1-final
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm install --prefix /tmp/volta-browser --no-package-lock --no-audit --no-fund playwright@1.57.0
          /tmp/volta-browser/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/volta-capture
          node scripts/capture-public.mjs
      - name: Preserve captured assets on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/showcase
          if ! git diff --cached --quiet; then
            git commit -m 'assets: capture published VOLTA product views with provenance'
            git push origin HEAD:feat/corporate-v1-final
          fi
          git rev-parse HEAD > /tmp/volta-capture/asset-commit.txt
          tar -czf /tmp/volta-capture/imagery.tar.gz public/showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-product-imagery
          path: /tmp/volta-capture
          retention-days: 7
