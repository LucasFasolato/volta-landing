name: Corporate isolated verification workspace
on:
  push:
    branches: [feat/corporate-hub-20260906]
permissions:
  contents: read
concurrency:
  group: corporate-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare scoped security patch for review
        run: |
          mkdir -p /tmp/corporate-evidence
          npm audit --omit=dev --json > /tmp/corporate-evidence/audit-before.json || true
          npm install --save-exact next@16.3.3 eslint-config-next@16.3.3
          npm audit --json > /tmp/corporate-evidence/audit-after.json || true
          npm audit --omit=dev --json > /tmp/corporate-evidence/audit-production.json || true
          git diff -- package.json package-lock.json > /tmp/corporate-evidence/security.patch
          cp package.json package-lock.json /tmp/corporate-evidence/
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix /tmp/volta-browser --no-package-lock --no-audit --no-fund playwright@1.57.0 @axe-core/playwright@4.11.0
          /tmp/volta-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify production build in the browser
        run: |
          npm start > /tmp/corporate-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000 >/dev/null && break; sleep 1; done
          node scripts/verify-browser.mjs
      - name: Package reproducible source and build
        if: always()
        run: |
          mkdir -p /tmp/corporate-evidence
          cp /tmp/corporate-server.log /tmp/corporate-evidence/ 2>/dev/null || true
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='.env*' -czf /tmp/corporate-evidence/source.tar.gz .
          if [ -d .next ]; then tar -czf /tmp/corporate-evidence/build.tar.gz .next; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-hub-evidence
          path: /tmp/corporate-evidence
          retention-days: 3
          compression-level: 0
